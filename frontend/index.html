<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="KYC 1 CLICK — due diligence, AML/KYC screening and corporate mapping from public sources, in one click." />
    <title>KYC 1 CLICK — Due diligence & AML/KYC in one click</title>
    <script>
      // Apply the saved/system theme before first paint (no flash).
      try {
        const t = localStorage.getItem("kbc-theme");
        if (t !== "light") // dark by default
          document.documentElement.classList.add("dark");
      } catch {}
    </script>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
