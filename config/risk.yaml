# ---------------------------------------------------------------------------
# Risk scoring configuration — fully transparent, EDIT TO MATCH YOUR POLICY.
#
# Global score = sum over triggered factors of
#     weight x proximity_multiplier(distance of the closest affected entity)
# capped at 100. Each factor is counted once (its evidence lists every
# affected entity), so the score cannot be inflated by sheer volume.
# ---------------------------------------------------------------------------

weights:
  sanctions_match: 45          # confirmed-level name match on a sanctions list
  sanctions_possible_match: 15 # weaker match that still needs to be ruled out
  pep_match: 20
  pep_possible_match: 6
  leak_appearance: 12          # Offshore Leaks / Aleph leak collections
  fatf_blacklist: 30
  fatf_greylist: 10
  eu_tax_blacklist: 10
  offshore_jurisdiction: 8
  circular_ownership: 15
  long_ownership_chain: 10
  shared_domiciliation: 6
  recent_incorporation: 4
  dissolved_company: 3
  missing_accounts: 5
  nominee_director: 5          # one person sitting on many boards at one address
  sanctioned_counterparty: 30
  watchlist_match: 20          # debarment, Interpol red notice, criminal / court records
  pep_relative: 10             # family member or close associate of a PEP
  adverse_media: 6             # keyword-filtered press mentions: leads, verify relevance  # direct on-chain flows with a sanctioned wallet
  insolvency_proceedings: 10   # safeguard / receivership / liquidation published in a legal gazette
  ubo_discrepancy: 12          # computed UBO (>= threshold) missing from declared beneficial owners
  high_risk_country: 8         # company registered in a country with a high Basel AML Index / low CPI
  shell_company_indicators: 5  # total assets >= shell_min_assets with revenue <= 1 % of assets
  formation_agent: 6           # officer is a corporate service provider recurring in offshore leaks
  corporate_director: 4        # a company (not a person) sits as director / secretary
  multi_jurisdiction_officer: 4  # one person with positions in companies of many countries
  possible_same_person: 3      # near-identical names in different registers, not confirmed (no DOB)
  batch_incorporation: 5       # companies created within days, sharing an officer / address / owner
  pre_event_resignation: 8     # officer left shortly before the company's liquidation / insolvency
  officer_turnover: 4          # many appointments / departures within 12 months
  authorisation_withdrawn: 6   # a regulator's register shows a withdrawn authorisation / winding up

# Distance (in hops) between the investigated subject and the affected entity.
proximity_multiplier:
  0: 1.0
  1: 0.8
  2: 0.6
  3: 0.45
  default: 0.35

thresholds:
  strong_match_score: 85       # >= : counted as a match
  possible_match_score: 70     # >= : counted as a possible match, below : ignored
  long_chain_min_layers: 3     # number of corporate layers above a company
  shared_address_min_companies: 3
  recent_incorporation_months: 18
  accounts_overdue_months: 18
  nominee_min_mandates: 4
  ubo_threshold_pct: 25        # EU AMLD reference threshold for beneficial ownership
  basel_high_score: 6.0        # Basel AML Index >= : high money-laundering risk country (0-10 scale)
  cpi_low_score: 30            # Corruption Perceptions Index < : high corruption risk (0-100 scale)
  shell_min_assets: 1000000    # shell-company indicator: minimum total assets (in the filing currency)
  shell_max_revenue_ratio: 0.01
  multi_jurisdiction_min_countries: 3
  batch_incorporation_days: 7
  pre_event_resignation_days: 180
  officer_turnover_changes: 4  # appointments + departures within 365 days

levels:                        # global score -> level (lower bound inclusive)
  low: 0
  medium: 20
  high: 45
  critical: 70
