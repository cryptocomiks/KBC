name: Source probe

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_sources.py"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python scripts/probe_sources.py
